version: '3.9'
services:
  pocketbase:
    build: ./apps/pocketbase
    volumes:
      - pb_data:/pb/data
    ports:
      - "8090:8090"
    restart: unless-stopped
    networks:
      - app-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      - POCKETBASE_URL=http://pocketbase:8090
    ports:
      - "3001:3001"
    depends_on:
      - pocketbase
    restart: unless-stopped
    networks:
      - app-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - app-network

volumes:
  pb_data:

networks:
  app-network:
    driver: bridge
